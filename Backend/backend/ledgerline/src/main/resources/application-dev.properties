# ==============================================================================
# Development & Automated Testing Profile ('dev')
# Embedded H2 in PostgreSQL compatibility mode with H2 Console enabled
# ==============================================================================

spring.datasource.url=${DB_URL:jdbc:h2:mem:ledgerline_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Schema generation for dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

# H2 Web Console for interactive database inspection at http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
