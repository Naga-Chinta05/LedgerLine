# ==============================================================================
# LedgerLine - Primary Application Configuration
# Supports seamless switching between 'dev' (H2 in PostgreSQL mode) and 'prod' (PostgreSQL)
# ==============================================================================

spring.application.name=ledgerline
server.port=${SERVER_PORT:8085}

# Active Spring Profile (defaults to 'dev' for zero-config local run and testing)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common JPA / Hibernate settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Database Connection (Defaults to in-memory PostgreSQL-compatible H2 for dev/test)
# Overridden automatically by environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) or profile
spring.datasource.url=${DB_URL:jdbc:h2:mem:ledgerline_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Flyway Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Frontend Cross-Origin Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Security & JWT Configuration (256-bit secret key)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
